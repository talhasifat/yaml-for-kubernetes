# PORTS DEMO: all four ports with DIFFERENT numbers, so you can tell them apart.
# This image runs nginx on port 8080 (not 80).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ports-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ports-demo
  template:
    metadata:
      labels:
        app: ports-demo
    spec:
      containers:
      - name: app
        image: nginxinc/nginx-unprivileged:1.27
        ports:
        - containerPort: 8080   # CONTAINER PORT: where the app inside listens
---
apiVersion: v1
kind: Service
metadata:
  name: ports-demo
spec:
  type: NodePort
  selector:
    app: ports-demo
  ports:
  - port: 80            # PORT: the Service's own port (inside the cluster)
    targetPort: 8080    # TARGET PORT: the Pod port to forward to (= containerPort)
    nodePort: 30081     # NODE PORT: opened on every node for outside clients
# Try from this workstation (browser or curl):
#   curl http://localhost:30081
#   curl http://127.0.0.1:30081
