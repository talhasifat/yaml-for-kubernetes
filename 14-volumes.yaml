# VOLUMES: five ways a container can see files.
#   configMap  -> settings from 09-configmap.yaml
#   secret     -> credentials from 10-secret.yaml
#   persistentVolumeClaim -> the Bound PVC from 13-pvc.yaml
#   emptyDir   -> scratch space, dies with the Pod
#   hostPath   -> a folder on the node (DaemonSets use this; see 05-daemonset.yaml)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: volumes-demo
  labels:
    app: volumes-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: volumes-demo
  template:
    metadata:
      labels:
        app: volumes-demo
    spec:
      containers:
      - name: app
        image: busybox:1.36
        ports:
        - containerPort: 80
        command:
        - sh
        - -c
        - |
          mkdir -p /www
          echo "visit $(date) from $(hostname)" >> /data/visits.txt
          echo scratch > /cache/tmp.txt
          echo "node file from $(hostname)" >> /host-demo/note.txt
          {
            echo "<h1>volumes-demo</h1>"
            echo "<h2>configMap</h2><pre>"; cat /etc/app/config/welcome.txt; echo "</pre>"
            echo "<h2>secret username</h2><pre>"; cat /etc/app/secrets/username; echo "</pre>"
            echo "<h2>pvc</h2><pre>"; cat /data/visits.txt; echo "</pre>"
            echo "<h2>emptyDir</h2><pre>"; cat /cache/tmp.txt; echo "</pre>"
            echo "<h2>hostPath</h2><pre>"; cat /host-demo/note.txt; echo "</pre>"
          } > /www/index.html
          httpd -f -p 80 -h /www
        volumeMounts:
        - name: cfg
          mountPath: /etc/app/config
          readOnly: true
        - name: creds
          mountPath: /etc/app/secrets
          readOnly: true
        - name: pvc-data
          mountPath: /data
        - name: cache
          mountPath: /cache
        - name: host
          mountPath: /host-demo
        resources:
          requests: {cpu: 25m, memory: 32Mi}
          limits: {cpu: 100m, memory: 64Mi}
      volumes:
      - name: cfg
        configMap:
          name: app-config
      - name: creds
        secret:
          secretName: app-secret
      - name: pvc-data
        persistentVolumeClaim:
          claimName: academy-pvc
      - name: cache
        emptyDir: {}
      - name: host
        hostPath:
          path: /var/snap/microk8s/common/academy-storage/hostpath-demo
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: volumes-demo
spec:
  type: NodePort
  selector:
    app: volumes-demo
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30085
# Try from this workstation:
#   curl http://localhost:30085
#   microk8s kubectl -n manifest-demo delete pod -l app=volumes-demo
#   curl http://localhost:30085
# (PVC + hostPath lines survive; emptyDir resets)
