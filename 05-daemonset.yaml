# DAEMONSET: one Pod on EVERY node (there is no replicas field).
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-agent
spec:
  selector:
    matchLabels:
      app: node-agent
  template:
    metadata:
      labels:
        app: node-agent
    spec:
      containers:
      - name: agent
        image: busybox:1.36
        ports:
        - containerPort: 80
        command:
        - sh
        - -c
        - |
          echo "agent running on node $NODE_NAME" > /var/lib/node-agent/index.html
          httpd -f -p 80 -h /var/lib/node-agent
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName   # the node this Pod landed on
        volumeMounts:
        - name: node-data
          mountPath: /var/lib/node-agent
      volumes:
      - name: node-data
        hostPath:                      # DaemonSets use hostPath, not PVC (PVC is usually 1 node)
          path: /var/snap/microk8s/common/academy-storage/node-agent
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: node-agent
spec:
  type: NodePort
  selector:
    app: node-agent
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30084
# Try from this workstation:
#   curl http://localhost:30084
#   curl http://127.0.0.1:30084
