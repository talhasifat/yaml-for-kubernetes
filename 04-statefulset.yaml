# STATEFULSET: Pods named demo-sts-0, demo-sts-1, each with its OWN disk.
# Needs storage: microk8s enable hostpath-storage
apiVersion: v1
kind: Service
metadata:
  name: demo-sts
spec:
  clusterIP: None         # headless: gives each Pod its own DNS name
  selector:
    app: demo-sts
  ports:
  - port: 80
    name: web
---
# NodePort for the workstation (load-balances across demo-sts-0 and demo-sts-1).
apiVersion: v1
kind: Service
metadata:
  name: demo-sts-np
spec:
  type: NodePort
  selector:
    app: demo-sts
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30083
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: demo-sts
spec:
  serviceName: demo-sts   # the headless Service above
  replicas: 2
  selector:
    matchLabels:
      app: demo-sts
  template:
    metadata:
      labels:
        app: demo-sts
    spec:
      containers:
      - name: app
        image: busybox:1.36
        ports:
        - containerPort: 80
        command:
        - sh
        - -c
        - |
          echo "I am $(hostname) at $(date)" >> /data/index.html
          httpd -f -p 80 -h /data
        volumeMounts:
        - name: data
          mountPath: /data
  volumeClaimTemplates:   # one PVC per Pod: data-demo-sts-0, data-demo-sts-1
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: microk8s-hostpath   # created by: microk8s enable hostpath-storage
      resources:
        requests:
          storage: 1Gi
# Try from this workstation:
#   curl http://localhost:30083
#   microk8s kubectl -n manifest-demo delete pod demo-sts-0
#   curl http://localhost:30083
# (PVC keeps the old lines; you may hit demo-sts-1 until 0 is back)

