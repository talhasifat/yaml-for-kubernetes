# RBAC: who can do what.
# ServiceAccount = identity for Pods (and for classroom kubectl demos).
# Role           = permissions inside ONE namespace.
# RoleBinding    = attaches the Role to the ServiceAccount.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: classroom-sa
  labels:
    app: academy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: classroom-role
  labels:
    app: academy
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log", "pods/exec", "services", "configmaps", "secrets", "persistentvolumeclaims", "events"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses", "networkpolicies"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: classroom-sa-binding
  labels:
    app: academy
subjects:
- kind: ServiceAccount
  name: classroom-sa
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: classroom-role
# Try from this workstation:
#   curl http://localhost:30080
#   microk8s kubectl auth can-i get pods --as=system:serviceaccount:manifest-demo:classroom-sa -n manifest-demo
#   microk8s kubectl auth can-i get nodes --as=system:serviceaccount:manifest-demo:classroom-sa
#   (nodes are cluster-scoped — this Role cannot read them)
