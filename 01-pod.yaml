apiVersion: v1
kind: Pod
metadata:
  name: talha-fittrack-pod
  namespace: fitness-dev
  labels:
    app: fittrack-pod
    environment: dev
spec:
  containers:
  - name: web
    image: nginx:1.27
    ports:
    - containerPort: 8016
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "100m"
        memory: "128Mi"
    command: ["sh", "-c"]
    args:
    - |
      sed -i 's/listen\(.*\)80;/listen\18016;/' /etc/nginx/conf.d/default.conf &&
      echo '<h1>talha-fittrack-pod</h1>' > /usr/share/nginx/html/index.html &&
      exec nginx -g 'daemon off;'