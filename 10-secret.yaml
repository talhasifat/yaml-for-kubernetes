# SECRET: same idea as ConfigMap, but the values are stored as base64.
# stringData is for humans; Kubernetes converts it to data: (base64) on apply.
# NOT real security by itself — still protect etcd, RBAC, and encryption at rest.
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  labels:
    app: academy
type: Opaque
stringData:
  username: academy
  password: ChangeMe!
  db-url: postgres://academy:ChangeMe!@db:5432/class
# Try from this workstation (volumes-demo prints the username, not the password):
#   curl http://localhost:30085
# Optional cluster view:
#   microk8s kubectl -n manifest-demo get secret app-secret -o yaml
