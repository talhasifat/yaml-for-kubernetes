# CRONJOB: creates a Job on a schedule. Format: minute hour day-of-month month weekday
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hello-cron
spec:
  schedule: "*/2 * * * *"        # every 2 minutes
  concurrencyPolicy: Forbid      # skip a run if the last one is still going
  successfulJobsHistoryLimit: 3  # keep the last 3 finished Jobs
  failedJobsHistoryLimit: 1
  jobTemplate:                   # <- a Job description goes here
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: report
            image: busybox:1.36
            command: ["sh", "-c", "echo Scheduled run at $(date)"]
# Try from this workstation:
#   microk8s kubectl -n manifest-demo get cronjobs,jobs
#   microk8s kubectl -n manifest-demo logs -l job-name --tail=20
# CronJob has no NodePort (it exits). The class web app is still:
#   curl http://localhost:30080
