# DNS: CoreDNS (microk8s enable dns) is how Pods find Services by name.
# Cluster names look like:
#   web                                 (same namespace)
#   web.manifest-demo                   (other namespace)
#   web.manifest-demo.svc.cluster.local (FQDN)
#   demo-sts-0.demo-sts                 (headless StatefulSet Pod)
apiVersion: v1
kind: Pod
metadata:
  name: dns-test
  labels:
    app: dns-test
spec:
  containers:
  - name: dnsutils
    image: busybox:1.36
    ports:
    - containerPort: 80
    command:
    - sh
    - -c
    - |
      mkdir -p /www
      {
        echo "<h1>dns-test</h1><pre>"
        echo "=== kubernetes.default ==="
        nslookup kubernetes.default 2>&1 || true
        echo "=== web ==="
        nslookup web 2>&1 || true
        echo "=== web.manifest-demo.svc.cluster.local ==="
        nslookup web.manifest-demo.svc.cluster.local 2>&1 || true
        echo "</pre>"
      } > /www/index.html
      httpd -f -p 80 -h /www
    resources:
      requests: {cpu: 10m, memory: 16Mi}
      limits: {cpu: 50m, memory: 32Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: dns-test
spec:
  type: NodePort
  selector:
    app: dns-test
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30086
# Try from this workstation:
#   curl http://localhost:30086
#   curl http://localhost:30080
# Optional inside the cluster:
#   microk8s kubectl -n manifest-demo exec dns-test -- nslookup web
