# DEPLOYMENT: keeps 3 identical Pods running, replaces failed ones, does rolling updates.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: talha-fittrack-deployment
  namespace: fitness-dev
  labels:
    app: fittrack
    environment:dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fittrack           # must match the Pod labels in the template below
  template:               # <- a Pod description goes here
    metadata:
      labels:
        app: fittrack
        environment: dev
    spec:
      containers:
      - name: nginx
        image: nginx:1.27
        ports:
        - containerPort: 8016
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
        command: ["sh", "-c"]
        args:
        - |
          sed -i 's/listen\(.*\)80;/listen\18016;/' /etc/nginx/conf.d/default.conf &&
          echo "<h1>talha-fittrack-deployment - $(hostname)</h1>" > /usr/share/nginx/html/index.html &&
          exec nginx -g 'daemon off;'